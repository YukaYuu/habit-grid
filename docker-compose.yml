services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: habit_grid
      POSTGRES_USER: habit_grid
      POSTGRES_PASSWORD: habit_grid
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_grid -d habit_grid"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
